name: Build HUD sprites

on:
  push:
    paths:
      - 'scripts/prepare_hud_parts.py'
      - '.github/workflows/build-hud-parts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python scripts/prepare_hud_parts.py
      - name: Commit generated sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KamiUI/textures/*_base.tga KamiUI/textures/*_accent.tga
          git diff --cached --quiet || (git commit -m "Build power-of-two HUD sprites" && git push)
